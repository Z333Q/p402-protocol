version: 2
updates:
  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "ci"
    groups:
      actions-minor:
        patterns: ["actions/*"]
        update-types: ["minor", "patch"]

  # npm — single entry at workspace root.
  # The repo is an npm workspaces monorepo with a root package-lock.json,
  # so Dependabot must scan from "/" to keep the lockfile in sync when bumping
  # any workspace package. Per-package entries break `npm ci` because Dependabot
  # only updates the workspace's package.json and leaves the root lockfile stale.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "deps"
    ignore:
      # Project targets Node 20 LTS — don't bump @types/node past major 20
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      dev-patch:
        dependency-type: "development"
        update-types: ["patch"]
      prod-patch:
        dependency-type: "production"
        update-types: ["patch"]
