name: Bug Report
description: Report a bug in @p402/sdk or @p402/cli
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill out the details below.

  - type: dropdown
    id: package
    attributes:
      label: Package
      options:
        - "@p402/sdk"
        - "@p402/cli"
        - "Both"
        - "Other / API"
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Package Version
      description: Run `npm list @p402/sdk` or `npx p402 --version`
      placeholder: "1.1.0"
    validations:
      required: true

  - type: input
    id: node-version
    attributes:
      label: Node.js Version
      description: Run `node --version`
      placeholder: "v20.11.0"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: What happened? What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal Reproduction
      description: Minimal code snippet or CLI command that reproduces the issue
      render: typescript
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: Include full error output / stack trace if applicable
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Any other relevant information (OS, runtime environment, etc.)
