name: Publish @p402/sdk

on:
  push:
    tags:
      - 'sdk/v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Build and publish SDK
    runs-on: ubuntu-latest
    if: github.repository == 'Z333Q/p402-protocol'
    environment: npm-publish
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
      # Install from workspace root — lockfile lives here
      - run: npm ci
      - run: npm audit --audit-level=high --workspace packages/sdk
      - name: Type-check
        run: npm run typecheck --workspace packages/sdk
      - name: Build
        run: npm run build --workspace packages/sdk
      - name: Publish to npm
        working-directory: packages/sdk
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
