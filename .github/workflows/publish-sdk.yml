name: Publish @p402/sdk

on:
  push:
    tags:
      - 'sdk/v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Build and publish SDK
    runs-on: ubuntu-latest
    if: github.repository == 'Z333Q/p402-protocol'
    environment: npm-publish
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
      # Install from workspace root — lockfile lives here
      - run: npm ci
      - run: npm audit --audit-level=high --workspace packages/sdk
      - name: Type-check
        run: npm run typecheck --workspace packages/sdk
      - name: Build
        run: npm run build --workspace packages/sdk
      - name: Publish to npm
        working-directory: packages/sdk
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
