name: Publish P402 VS Code Extension

on:
  push:
    tags:
      - 'vscode/v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Build and publish extension
    runs-on: ubuntu-latest
    if: github.repository == 'Z333Q/p402-protocol'
    environment: vscode-publish
    defaults:
      run:
        working-directory: packages/vscode

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        working-directory: .

      - name: Build SDK (required by MCP server bundle)
        run: npm run build -w packages/sdk
        working-directory: .

      # Build once — vscode:prepublish bundles MCP server + compiles extension
      # Then package into a .vsix. Both publish steps use the pre-built file
      # so vscode:prepublish never runs again and duplicate-version errors
      # cannot occur.
      - name: Build and package extension
        run: |
          npm run vscode:prepublish
          npx vsce package --no-dependencies --out p402.vsix

      - name: Publish to VS Code Marketplace
        run: npx vsce publish --no-dependencies --packagePath p402.vsix -p ${{ secrets.VSCE_PAT }}

      - name: Create Open VSX namespace (no-op if already exists)
        run: npx ovsx create-namespace p402-protocol -p ${{ secrets.OVSX_TOKEN }} || true

      - name: Publish to Open VSX Registry
        run: npx ovsx publish p402.vsix -p ${{ secrets.OVSX_TOKEN }}

      - name: Upload .vsix artifact
        uses: actions/upload-artifact@v4
        with:
          name: p402-vscode-extension
          path: packages/vscode/p402.vsix
