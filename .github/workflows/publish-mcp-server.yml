name: Publish @p402/mcp-server

on:
  push:
    tags:
      - 'mcp-server/v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish-npm:
    name: Build and publish to npm
    runs-on: ubuntu-latest
    if: github.repository == 'Z333Q/p402-protocol'
    environment: npm-publish
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Audit dependencies
        run: npm audit --audit-level=high --workspace packages/mcp-server
      - name: Type-check
        run: npm run typecheck --workspace packages/mcp-server
      - name: Build
        run: npm run build --workspace packages/mcp-server
      - name: Extract version
        id: version
        run: echo "version=$(node -p "require('./packages/mcp-server/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Publish to npm
        working-directory: packages/mcp-server
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-mcp-registry:
    name: Publish to MCP Registry
    runs-on: ubuntu-latest
    needs: publish-npm
    if: github.repository == 'Z333Q/p402-protocol'
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install mcp-publisher
        run: |
          curl -fsSL \
            "https://github.com/modelcontextprotocol/registry/releases/download/v1.5.0/mcp-publisher_linux_amd64.tar.gz" \
            -o mcp-publisher.tar.gz
          tar xzf mcp-publisher.tar.gz mcp-publisher
          sudo mv mcp-publisher /usr/local/bin/
          mcp-publisher --version
      - name: Authenticate with GitHub OIDC
        run: mcp-publisher login github-oidc
      - name: Publish to MCP Registry
        working-directory: packages/mcp-server
        run: mcp-publisher publish
